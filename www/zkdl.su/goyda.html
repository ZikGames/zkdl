<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>~*~ Добро пожаловать на мою домашнюю страничку! ~*~</title>
    <style>
        body {
            background-color: #000080; /* Тот самый синий */
            color: #00ff00;            /* Кислотно-зеленый текст */
            font-family: "Courier New", Courier, monospace;
            margin: 20px;
            padding: 0;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        td {
            padding: 10px;
            vertical-align: top;
        }
        /* Главный контейнер-рамка сайта */
        .main-table {
            border: 4px double #ffffff;
            background-color: #000000; /* Черный фон контента */
        }
        /* Шапка с градиентом из 90-х */
        .header {
            background: linear-gradient(90deg, #800080, #000080);
            border-bottom: 3px ridge #ffffff;
            text-align: center;
            padding: 20px;
        }
        .site-title {
            color: #ffff00;
            font-family: "Impact", "Arial Black", sans-serif;
            font-size: 28pt;
            text-shadow: 3px 3px #ff0000;
            margin: 0;
            letter-spacing: 2px;
        }
        /* Эмуляция тега <blink> */
        .blink-text {
            color: #ff00ff;
            font-weight: bold;
            animation: blinker 1s linear infinite;
            text-align: center;
            margin-top: 5px;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
        /* Эмуляция тега <marquee> */
        .marquee-box {
            background-color: #222;
            border: 2px inset #888;
            color: #00ffff;
            padding: 5px;
            font-weight: bold;
            margin: 10px 0;
            overflow: hidden;
            white-space: nowrap;
        }
        /* Левая колонка (Сайдбар) */
        .nav-sidebar {
            width: 25%;
            border-right: 3px ridge #ffffff;
            background-color: #111111;
        }
        .nav-title {
            background-color: #000080;
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            padding: 4px;
            border: 1px solid #ffffff;
            text-transform: uppercase;
            font-size: 10pt;
        }
        .nav-links {
            list-style-type: none;
            padding: 0;
            margin: 15px 0 0 0;
        }
        .nav-links li {
            margin-bottom: 10px;
        }
        .nav-links a {
            color: #00ffff;
            text-decoration: underline;
            font-weight: bold;
            display: block;
        }
        .nav-links a:hover {
            color: #ffff00;
            background-color: #000080;
        }
        /* Правая колонка (Контент) */
        .content-area {
            width: 75%;
            padding: 20px;
        }
        h2 {
            color: #ff0000;
            font-family: "Arial", sans-serif;
            font-size: 16pt;
            border-bottom: 2px dashed #ff0000;
            margin-top: 0;
            padding-bottom: 3px;
        }
        .news-box {
            border: 1px solid #00ff00;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #051a05;
        }
        .news-date {
            color: #ffff00;
            font-weight: bold;
        }
        /* Плашка Under Construction */
        .construction {
            border: 2px dashed #ffff00;
            background-color: #333300;
            color: #ffffff;
            padding: 10px;
            text-align: center;
            margin-top: 25px;
        }
        /* Олдскульный счетчик */
        .counter-box {
            text-align: center;
            margin-top: 30px;
            padding: 10px;
            border-top: 3px ridge #ffffff;
        }
        .counter-digits {
            background-color: #000000;
            color: #ff0000;
            font-family: "Courier New", monospace;
            font-weight: bold;
            font-size: 16pt;
            padding: 2px 6px;
            border: 2px inset #888;
            letter-spacing: 2px;
        }
        /* Кнопки 88x31 */
        .button-grid {
            margin-top: 20px;
            text-align: center;
        }
        .web-button {
            display: inline-block;
            width: 88px;
            height: 31px;
            font-size: 8pt;
            font-family: "Arial", sans-serif;
            line-height: 27px;
            text-align: center;
            margin: 4px;
            vertical-align: middle;
            cursor: pointer;
        }
        .ie-button { background: linear-gradient(135deg, #0000ff, #0080ff); color: #fff; font-weight: bold; border: 2px outset #fff; }
